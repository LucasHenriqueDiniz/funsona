name = "funsona-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Secrets (set via `wrangler secret put` or .dev.vars locally)
# CLERK_PUBLISHABLE_KEY
# CLERK_SECRET_KEY
# CLERK_WEBHOOK_SECRET
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# JWT_SECRET (legacy — only used by data still tied to the old session cookie during cutover)

[[kv_namespaces]]
binding = "FUNSONA_CACHE"
id = "02dbd51b0bac4b67a0edafee77697595"

[[d1_databases]]
binding = "DB"
database_name = "funsona-db"
database_id = "7ad0df13-fc07-4260-8342-c2da641ce4ed"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "QUIZ_IMAGES"
bucket_name = "funsona-quiz-images"

[[r2_buckets]]
binding = "PROFILE_MEDIA"
bucket_name = "funsona-profile-media"

[vars]
ENVIRONMENT = "production"

# Local dev vars
[env.dev]
name = "funsona-api-dev"

[env.dev.vars]
ENVIRONMENT = "development"
