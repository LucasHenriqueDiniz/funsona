name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No 'version': the action reads the packageManager field from package.json,
      # which is what keeps CI and local machines on the same pnpm version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Typecheck builds packages/shared first, because apps/api imports its
      # dist and not its source — without that a clean clone fails with TS2307.
      # It covers the WHOLE workspace (`pnpm -r typecheck`), which is why there
      # is no build step here: `pnpm -r build` runs `tsc --noEmit` in apps/api
      # (already done by this step), `tsc` in packages/shared (same, in the
      # first half) and `astro build` in apps/web — which Cloudflare Pages
      # builds and publishes on every push, reporting back as a commit check.
      - name: Typecheck
        run: pnpm typecheck

