name = "funsona-web"
compatibility_date = "2026-05-22"
# Clerk's server-side code (clerkMiddleware, used in apps/web/src/middleware.ts)
# builds an AsyncLocalStorage, which is node:async_hooks. Without this flag the
# Worker throws `No such module "node:async_hooks"` on EVERY render — the whole
# site 500s, not just the authenticated parts.
compatibility_flags = ["nodejs_als"]
pages_build_output_dir = "./apps/web/dist"

# Cloudflare Pages' Git-integration build detects THIS file (repo root, Root
# directory setting is unset — see the ccb2811 commit), not
# apps/web/wrangler.toml. Clerk's Astro integration reads this var through
# the typed astro:env schema, and process.env already has it set once
# Cloudflare injects it (Vite won't override an already-set process.env var
# from .env.production), so it needs to be defined here. Cloudflare's
# injection prepends a BOM to the value — sanitized in astro.config.mjs.
# Safe to commit: this is the publishable key, designed to ship in frontend
# code.
[vars]
PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsuZnVuc29uYS5jb20k"
