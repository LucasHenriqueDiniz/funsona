name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem 'version': a action lê o campo packageManager do package.json, que é
      # o que mantém o CI e as máquinas locais na mesma versão de pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  # funsona-web (Cloudflare Pages) deploys automatically on push via its own
  # Git integration. funsona-api is a plain Worker with no Git integration —
  # deploying it always required someone to remember to run `wrangler deploy`
  # by hand, which is easy to forget after backend-only changes. This job
  # closes that gap for pushes to main.
  deploy-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem 'version': a action lê o campo packageManager do package.json, que é
      # o que mantém o CI e as máquinas locais na mesma versão de pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/api imports the compiled output of packages/shared, not its
      # source — wrangler deploy fails to resolve "@FunSona/shared" without
      # this build step running first.
      - name: Build packages/shared
        run: pnpm --filter @FunSona/shared build

      - name: Deploy funsona-api
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/api
          command: deploy
