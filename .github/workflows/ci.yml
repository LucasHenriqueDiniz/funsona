name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem 'version': a action lê o campo packageManager do package.json, que é
      # o que mantém o CI e as máquinas locais na mesma versão de pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # O typecheck constroi packages/shared antes, porque apps/api importa o
      # dist dele e nao o source — sem isso um clone limpo falha com TS2307.
      # Ele cobre TODO o workspace (`pnpm -r typecheck`), e por isso nao ha
      # passo de build aqui: `pnpm -r build` roda `tsc --noEmit` em apps/api
      # (que este passo ja faz), `tsc` em packages/shared (idem, na primeira
      # metade) e `astro build` em apps/web — que o Cloudflare Pages constroi e
      # publica a cada push, reportando como check no commit.
      - name: Typecheck
        run: pnpm typecheck

