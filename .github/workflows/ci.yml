name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem 'version': a action lê o campo packageManager do package.json, que é
      # o que mantém o CI e as máquinas locais na mesma versão de pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # O typecheck constroi packages/shared antes, porque apps/api importa o
      # dist dele e nao o source — sem isso um clone limpo falha com TS2307.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
